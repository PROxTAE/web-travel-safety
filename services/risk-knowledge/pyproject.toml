[project]
name = "sta-risk-knowledge"
version = "1.0.0"
description = "Local risk model (real historical data), deterministic safety overrides, Disaster RAG with citations, route exposure ranking"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sta-common",
  "sta-contracts",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "orjson>=3.10,<4",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "polars>=1.12,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "qdrant-client>=1.12,<2",
  "rank-bm25>=0.2.2,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<6",
  "sentence-transformers>=3.3,<4",
  "torch>=2.4",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML",
  "hypothesis>=6.115,<7",
]

[tool.uv.sources]
sta-common = { path = "../../packages/python-common", editable = true }
sta-contracts = { path = "../../packages/contracts", editable = true }
# CPU-only torch: the embedding model (multilingual-e5-small) runs on CPU; CUDA wheels add ~3 GB to the image
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "training"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC", "E501"]
"training/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs running infra", "canary: calls real providers", "slow: downloads models"]
