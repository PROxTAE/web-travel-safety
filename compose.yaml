# Smart Travel Assistant — runtime topology.
# No host-specific bind paths and no real secrets live here; values come from .env.
# Profiles: (default) core + app | observability | notifications | training
name: smart-travel-assistant

x-python-service: &python-service
  restart: unless-stopped
  env_file: .env
  networks: [internal]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-py-health: &py-health
  test: ["CMD", "python", "/app/healthcheck.py"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      POSTGRES_AGENT_PASSWORD: ${POSTGRES_AGENT_PASSWORD}
      POSTGRES_PROVIDER_PASSWORD: ${POSTGRES_PROVIDER_PASSWORD}
      POSTGRES_INTEGRATION_PASSWORD: ${POSTGRES_INTEGRATION_PASSWORD}
      POSTGRES_KNOWLEDGE_PASSWORD: ${POSTGRES_KNOWLEDGE_PASSWORD}
      POSTGRES_DECISION_PASSWORD: ${POSTGRES_DECISION_PASSWORD}
      POSTGRES_RECOMMENDATION_PASSWORD: ${POSTGRES_RECOMMENDATION_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [internal]

  # ----------------------------------------------------------------- app ----
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  api:
    <<: *python-service
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *py-health
    environment:
      SERVICE_NAME: api
      SERVICE_PORT: "8000"

  agent:
    <<: *python-service
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: agent
    healthcheck: *py-health
    environment:
      SERVICE_NAME: agent
      SERVICE_PORT: "8001"

  external-data:
    <<: *python-service
    build:
      context: .
      dockerfile: services/external-data/Dockerfile
    container_name: external-data
    healthcheck: *py-health
    environment:
      SERVICE_NAME: external-data
      SERVICE_PORT: "8002"
    volumes:
      - gtfs-cache:/app/data/gtfs-cache

  data-integration:
    <<: *python-service
    build:
      context: .
      dockerfile: services/data-integration/Dockerfile
    container_name: data-integration
    healthcheck: *py-health
    environment:
      SERVICE_NAME: data-integration
      SERVICE_PORT: "8003"

  risk-knowledge:
    <<: *python-service
    build:
      context: .
      dockerfile: services/risk-knowledge/Dockerfile
    container_name: risk-knowledge
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck: *py-health
    environment:
      SERVICE_NAME: risk-knowledge
      SERVICE_PORT: "8004"
    volumes:
      - model-artifacts:/app/artifacts
      - knowledge-cache:/app/knowledge/cache
      - hf-cache:/home/app/.cache/huggingface
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  decision-engine:
    <<: *python-service
    build:
      context: .
      dockerfile: services/decision-engine/Dockerfile
    container_name: decision-engine
    healthcheck: *py-health
    environment:
      SERVICE_NAME: decision-engine
      SERVICE_PORT: "8005"

  recommendation:
    <<: *python-service
    build:
      context: .
      dockerfile: services/recommendation/Dockerfile
    container_name: recommendation
    healthcheck: *py-health
    environment:
      SERVICE_NAME: recommendation
      SERVICE_PORT: "8006"

  recommendation-worker:
    <<: *python-service
    build:
      context: .
      dockerfile: services/recommendation/Dockerfile
    container_name: recommendation-worker
    command: ["python", "-m", "app.workers.main"]
    environment:
      SERVICE_NAME: recommendation-worker
      SERVICE_PORT: "8016"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------- observability ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: otel-collector
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]

  # -------------------------------------------------------- notifications ----
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mailpit
    profiles: [notifications]
    networks: [internal]

  # -------------------------------------------------------------- training ----
  risk-training:
    build:
      context: .
      dockerfile: services/risk-knowledge/Dockerfile
    container_name: risk-training
    profiles: [training]
    env_file: .env
    command: ["python", "-m", "training.train"]
    volumes:
      - model-artifacts:/app/artifacts
      - training-data:/app/data
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  model-artifacts:
  knowledge-cache:
  hf-cache:
  gtfs-cache:
  training-data:
  prometheus-data:
  grafana-data:
