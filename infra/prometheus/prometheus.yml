global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
          - agent:8001
          - external-data:8002
          - data-integration:8003
          - risk-knowledge:8004
          - decision-engine:8005
          - recommendation:8006
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
